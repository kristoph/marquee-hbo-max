[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Layout arithmetic moves between pixel, index and byte counts all the time.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Nothing here is a published API.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Rows and start-up options are described by independent yes-or-no facts.
struct_excessive_bools = "allow"
# A two-armed `match` on a condition reads as well as `if`/`else` and is used on purpose.
match_bool = "allow"
single_match_else = "allow"

[workspace.dependencies]
max-api = { path = "crates/max-api" }
max-media = { path = "crates/max-media" }
base64 = "0.22"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }
log = "0.4"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.37"
thiserror = "2"
ureq = "3.4.2"
wry = { version = "0.57", features = ["devtools"] }
block2 = "0.6"
dispatch2 = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor"] }
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDate", "NSError", "NSSet", "NSString", "NSDictionary", "NSGeometry", "NSHTTPCookie", "NSURL", "NSValue"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore"] }
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video"] }
objc2-core-video = "0.3"
objc2-core-media = "0.3"

# Unoptimized, image decoding and the app's own layout code are too slow to judge the app by.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
